name: Publish vision-router to npm

on:
  push:
    branches: [main]
    paths:
      - 'vision-router/**'
      - '.github/workflows/publish-vision-router.yml'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: vision-router
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run checks
        run: npm run check || true

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public
